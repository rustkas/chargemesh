[workspace]
members = [
    "crates/chargemesh-core",
    "crates/chargemesh-ir",
    "crates/chargemesh-ocpp",
    "crates/chargemesh-capability",
    "apps/chargemesh-cli",
]

[workspace.dependencies]
# Core
chargemesh-core = { path = "crates/chargemesh-core" }
chargemesh-ir = { path = "crates/chargemesh-ir" }
chargemesh-ocpp = { path = "crates/chargemesh-ocpp" }
chargemesh-capability = { path = "crates/chargemesh-capability" }

# Apps
chargemesh-cli = { path = "apps/chargemesh-cli" }

# External dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_repr = "0.1"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
derive_more = { version = "0.99", features = ["display", "from"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
regex = "1.0"
lazy_static = "1.4"

# Rule Engine
pest = "2.7"
pest_derive = "2.7"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0
debug = true