[package]
name = "chargemesh-wasm"
version = "0.1.0"
edition = "2021"
authors = ["ChargeMesh Team"]
description = "WASM bindings for ChargeMesh"
license = "Apache-2.0"
repository = "https://github.com/rustkas/chargemesh"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chargemesh-core = { path = "../chargemesh-core" }
chargemesh-ir = { path = "../chargemesh-ir" }
chargemesh-ocpp = { path = "../chargemesh-ocpp" }
chargemesh-capability = { path = "../chargemesh-capability" }
chargemesh-diagnostics = { path = "../chargemesh-diagnostics" }

wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "HtmlElement", "Node"] }
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1