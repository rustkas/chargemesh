[workspace]
members = [
    "crates/chargemesh-core",
    # Будут добавлены позже:
    # "crates/chargemesh-ir",
    # "crates/chargemesh-ocpp",
    # ...
]

[workspace.dependencies]
# Базовые зависимости для всех крейтов
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
derive_more = { version = "0.99", features = ["display", "from"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0
debug = true